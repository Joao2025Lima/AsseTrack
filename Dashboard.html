<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>AsseTrack - Dashboard</title>
    <link rel="stylesheet" href="painel.css">
</head>
<body>

   
    <div class="tela-sistema">

       
        <nav class="menu-lateral">
            <div class="logo">
                <h2>AsseTrack</h2>
                <p>Gestão de ativos</p>
            </div>
            
            <ul class="lista-menu">
                <li><a href="#" class="ativo">Dashboard</a></li>
                <li><a href="#">Lista de ativos</a></li>
                <li><a href="#">Cadastro de ativo</a></li>
                <li><a href="#">Mapa de ativos (Links)</a></li>
                <li><a href="#">Histórico</a></li>
            </ul>
        </nav>

        
        <main class="conteudo-principal">
            
            
            <header class="cabecalho">
                <h2>Dashboard</h2>
                <div class="usuario">Guilherme</div>
            </header>

           
            <div class="area-cards">
                
                <div class="card">
                    <p>Total de ativos</p>
                    <h3>248</h3>
                </div>

                <div class="card">
                    <p>Ativos localizados</p>
                    <h3 style="color: green;">196</h3>
                </div>

                <div class="card">
                    <p>Sem atualização</p>
                    <h3 style="color: orange;">34</h3>
                </div>

                <div class="card">
                    <p>Sem localização</p>
                    <h3 style="color: red;">18</h3>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
